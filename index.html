<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharkie</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>

        <div class="audio-controls">
            <button id="mute-button" class="mute-button">
                <img id="mute-icon" src="img/ui/screens/volume-on.svg" alt="Mute">
            </button>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.05" value="0.6">
        </div>

        <div id="start-screen" class="overlay">
            <h1 class="game-title">SHARKIE</h1>
            <div class="controls-box">
                <div class="control-line">
                    <div class="control-row">
                        <img src="img/ui/screens/key-arrows.png" alt="Arrow keys">
                        <span>Move Shark</span>
                    </div>
                    <div class="control-row">
                        <img src="img/ui/screens/key-d.png" alt="D key">
                        <span>Fin Slap</span>
                    </div>
                </div>
                <div class="control-row">
                    <img src="img/ui/screens/key-space.png" alt="Space key">
                    <span>Bubble Shot</span>
                </div>
            </div>
            <img id="start-button" class="button" src="img/ui/screens/start-button.png" alt="Start">
            <button id="impressum-link" class="text-link">Impressum</button>
        </div>

        <div id="end-screen" class="overlay hidden">
            <img id="end-title" src="" alt="">
            <div class="end-actions">
                <img id="try-again-button" class="button" src="img/ui/screens/try-again-button.png" alt="Try Again">
                <button id="back-to-menu-button" class="text-link">Back to Menu</button>
            </div>
        </div>

        <div id="impressum-overlay" class="overlay hidden">
            <div class="impressum-box">
                <h2>Impressum</h2>
                <p>
                    Lucas Lohmann<br>
                    Ribnitzer Stra&szlig;e 19<br>
                    13051 Berlin
                </p>
                <p>
                    <strong>Kontakt</strong><br>
                    E-Mail: lucas.lohmann.berlin@gmail.com
                </p>
                <button id="impressum-close" class="text-link">Close</button>
            </div>
        </div>
    </div>

    <div id="mobile-controls" class="hidden">
        <div class="dpad">
            <button class="mobile-btn dpad-up" data-key="UP">&#9650;</button>
            <button class="mobile-btn dpad-left" data-key="LEFT">&#9664;</button>
            <button class="mobile-btn dpad-right" data-key="RIGHT">&#9654;</button>
            <button class="mobile-btn dpad-down" data-key="DOWN">&#9660;</button>
        </div>
        <div class="attack-pad">
            <button class="mobile-btn attack-btn" data-key="D">Fin Slap</button>
            <button class="mobile-btn attack-btn" data-key="SPACE">Bubble</button>
        </div>
    </div>

    <div id="rotate-overlay">
        <div class="phone"></div>
        <div class="message">Please rotate your device!</div>
    </div>

    <script src="js/image-hub.js"></script>
    <script src="js/audio-hub.js"></script>
    <script src="classes/drawable-object.class.js"></script>
    <script src="classes/movable-object.class.js"></script>
    <script src="classes/background-object.class.js"></script>
    <script src="classes/coin.class.js"></script>
    <script src="classes/green-bubble.class.js"></script>
    <script src="classes/health-bar.class.js"></script>
    <script src="classes/sound-manager.class.js"></script>
    <script src="classes/bubble.class.js"></script>
    <script src="classes/pufferfish.class.js"></script>
    <script src="classes/jellyfish.class.js"></script>
    <script src="classes/endboss.class.js"></script>
    <script src="classes/character.class.js"></script>
    <script src="classes/level.class.js"></script>
    <script src="classes/world.class.js"></script>
    <script src="classes/keyboard.class.js"></script>
    <script src="js/level1.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
